name: Publish Yadea Article Once

on:
  push:
    branches: [main]
    paths:
      - 'publishing/yadea-2025/run.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-yadea-article-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check pending Yadea package
        shell: bash
        run: |
          set -euo pipefail
          test -f publishing/yadea-2025/metadata.json
          test -f publishing/yadea-2025/asset_urls.json
          test -f publishing/yadea-2025/article-part-01.md
          test "$(jq 'length' publishing/yadea-2025/asset_urls.json)" -eq 8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publishing dependencies
        run: pip install --disable-pip-version-check oss2 markdown pillow requests

      - name: Publish Yadea article
        shell: bash
        env:
          PUBLISH_MANIFEST: publishing/yadea-2025/manifest.json
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ vars.ALIYUN_OSS_BUCKET || secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ vars.ALIYUN_OSS_ENDPOINT || secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_PUBLIC_BASE_URL: ${{ vars.ALIYUN_OSS_PUBLIC_BASE_URL || secrets.ALIYUN_OSS_PUBLIC_BASE_URL }}
          ALIYUN_OSS_PREFIX: ${{ vars.ALIYUN_OSS_PREFIX || 'blog/admin' }}
        run: |
          set -euo pipefail
          {
            echo '=== assemble manifest and merge temporary source URLs ==='
            python - <<'PY'
          import json
          from pathlib import Path

          project_dir = Path('publishing/yadea-2025')
          metadata = json.loads((project_dir / 'metadata.json').read_text(encoding='utf-8'))
          parts = sorted(project_dir.glob('article-part-*.md'))
          if not parts:
              raise SystemExit('article parts missing')
          urls = json.loads((project_dir / 'asset_urls.json').read_text(encoding='utf-8'))
          if len(urls) != 8:
              raise SystemExit(f'expected 8 source URLs, got {len(urls)}')
          for name, url in urls.items():
              if not url.startswith('https://'):
                  raise SystemExit(f'{name}: source URL must be HTTPS')
          metadata['markdown'] = ''.join(p.read_text(encoding='utf-8') for p in parts).strip()
          metadata['asset_urls'] = urls
          (project_dir / 'manifest.json').write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f'assembled {len(parts)} article parts and {len(urls)} assets')
          PY

            echo '=== validate OSS configuration ==='
            test -n "$ALIYUN_OSS_ACCESS_KEY_ID"
            test -n "$ALIYUN_OSS_ACCESS_KEY_SECRET"
            test -n "$ALIYUN_OSS_BUCKET"
            test -n "$ALIYUN_OSS_ENDPOINT"

            echo '=== download sources, convert to WebP, upload OSS and generate website files ==='
            python scripts/publish_oss_article.py

            echo '=== verify generated website files ==='
            md='content/articles/yadea-dealer-recovery-2025.md'
            html='blog/articles/yadea-dealer-recovery-2025.html'
            test -f "$md"
            test -f "$html"
            test -f blog/articles.json
            test -f blog/index.html
            test -f index.html
            test -f sitemap.xml
            test -f publishing-result.json
            grep -q 'https://dupontmaster.oss-cn-hangzhou.aliyuncs.com/' "$md"
            grep -q 'https://dupontmaster.oss-cn-hangzhou.aliyuncs.com/' "$html"
            ! grep -Eq 'at\.adobe\.com|127\.0\.0\.1|\{\{image:|data:image|base64' "$md" "$html"
            grep -q 'yadea-dealer-recovery-2025' blog/articles.json blog/index.html index.html sitemap.xml
            python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('publishing-result.json').read_text(encoding='utf-8'))
          assets = result.get('assets', {})
          if len(assets) != 8:
              raise SystemExit(f'expected 8 OSS assets, got {len(assets)}')
          for name, url in assets.items():
              if not url.startswith('https://dupontmaster.oss-cn-hangzhou.aliyuncs.com/'):
                  raise SystemExit(f'{name}: invalid OSS URL {url}')
              print(f'oss: {name} -> {url}')
          PY
            echo 'publication validation: passed'
          } 2>&1 | tee _yadea_publish.log

      - name: Commit published article
        shell: bash
        run: |
          set -euo pipefail
          rm -f _yadea_publish.log yadea-publish-diagnostic.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '发布官网文章：yadea-dealer-recovery-2025'
          git push

      - name: Save diagnostic log on failure
        if: failure()
        shell: bash
        run: |
          set +e
          {
            echo '# Yadea website publication diagnostic'
            echo
            echo "- trigger_commit: ${{ github.sha }}"
            echo "- run_id: ${{ github.run_id }}"
            echo
            echo '```text'
            if [[ -f _yadea_publish.log ]]; then
              tail -n 400 _yadea_publish.log
            else
              echo 'The workflow failed before a publication log was created.'
            fi
            echo '```'
          } > yadea-publish-diagnostic.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yadea-publish-diagnostic.md
          git commit -m '雅迪官网发布失败诊断' || exit 0
          git push || true
          exit 1

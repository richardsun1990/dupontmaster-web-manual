name: Publish Yadea Article Once

on:
  push:
    branches: [main]
    paths:
      - 'publishing/yadea-2025/run.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-yadea-article-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publishing dependencies
        run: pip install --disable-pip-version-check oss2 markdown pillow requests

      - name: Assemble manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          project_dir = Path('publishing/yadea-2025')
          metadata_path = project_dir / 'metadata.json'
          parts = sorted(project_dir.glob('article-part-*.md'))
          if not metadata_path.exists():
              raise SystemExit('metadata.json missing')
          if not parts:
              raise SystemExit('article parts missing')
          manifest = json.loads(metadata_path.read_text(encoding='utf-8'))
          manifest['markdown'] = ''.join(p.read_text(encoding='utf-8') for p in parts).strip()
          (project_dir / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f'assembled {len(parts)} article parts')
          PY

      - name: Rebuild and serve temporary image package
        shell: bash
        run: |
          set -euo pipefail
          project_dir='publishing/yadea-2025'
          shopt -s nullglob
          parts=("$project_dir"/assets.zip.b64.part-*)
          if (( ${#parts[@]} == 0 )); then
            echo 'No image package parts found' >&2
            exit 1
          fi
          cat "${parts[@]}" | tr -d '\n\r ' | base64 --decode > "$project_dir/assets.zip"
          unzip -t "$project_dir/assets.zip"
          mkdir -p "$project_dir/assets"
          unzip -o "$project_dir/assets.zip" -d "$project_dir/assets"
          test "$(find "$project_dir/assets" -maxdepth 1 -name '*.webp' | wc -l)" -eq 8
          python -m http.server 8765 --bind 127.0.0.1 --directory "$project_dir/assets" >/tmp/yadea-assets-http.log 2>&1 &
          echo $! >/tmp/yadea-assets-http.pid
          sleep 2
          for file in cover.webp chart-profitability.webp chart-cashflow.webp chart-assets.webp chart-peer-roe.webp evidence-card.webp conclusion-card.webp risk-card.webp; do
            curl --fail --silent --show-error "http://127.0.0.1:8765/$file" >/dev/null
          done

      - name: Merge temporary image URLs
        shell: bash
        run: |
          set -euo pipefail
          project_dir='publishing/yadea-2025'
          jq --slurpfile urls "$project_dir/asset_urls.json" '. + {asset_urls: $urls[0]}' "$project_dir/manifest.json" > "$project_dir/manifest.tmp"
          mv "$project_dir/manifest.tmp" "$project_dir/manifest.json"

      - name: Publish article and upload images to OSS
        env:
          PUBLISH_MANIFEST: publishing/yadea-2025/manifest.json
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ vars.ALIYUN_OSS_BUCKET || secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ vars.ALIYUN_OSS_ENDPOINT || secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_PUBLIC_BASE_URL: ${{ vars.ALIYUN_OSS_PUBLIC_BASE_URL || secrets.ALIYUN_OSS_PUBLIC_BASE_URL }}
          ALIYUN_OSS_PREFIX: ${{ vars.ALIYUN_OSS_PREFIX || 'blog/admin' }}
        run: python scripts/publish_oss_article.py

      - name: Verify generated website files
        shell: bash
        run: |
          set -euo pipefail
          md='content/articles/yadea-dealer-recovery-2025.md'
          html='blog/articles/yadea-dealer-recovery-2025.html'
          test -f "$md"
          test -f "$html"
          test -f blog/articles.json
          test -f blog/index.html
          test -f sitemap.xml
          grep -q 'https://dupontmaster.oss-cn-hangzhou.aliyuncs.com/' "$md"
          grep -q 'https://dupontmaster.oss-cn-hangzhou.aliyuncs.com/' "$html"
          ! grep -q '127.0.0.1\|{{image:\|data:image\|base64' "$md" "$html"
          grep -q 'yadea-dealer-recovery-2025' blog/articles.json blog/index.html sitemap.xml

      - name: Commit published article
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '发布官网文章：yadea-dealer-recovery-2025'
          git push

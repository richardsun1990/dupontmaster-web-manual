name: Patch Wechatsync Existing Slug Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-wechatsync-slug-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch bridge to reuse existing slug by normalized title
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/publish_wechatsync_zip.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''def stable_slug(title: str) -> str:\n    # Stable across repeated exports. If the title contains useful latin tokens, keep them;\n    # otherwise use a deterministic short hash rather than a fragile filename-derived slug.\n    latin = "-".join(re.findall(r"[A-Za-z0-9]+", title.lower()))\n    latin = re.sub(r"-+", "-", latin).strip("-")[:42]\n    digest = hashlib.sha1(title.encode("utf-8")).hexdigest()[:10]\n    return f"{latin}-{digest}".strip("-") if latin else f"article-{digest}"\n'''
          addition = anchor + '''\n\ndef normalized_title(value: str) -> str:\n    value = value.lower().strip()\n    return re.sub(r"[\\s：:，,。！？!?《》“”‘’\\\"'·—_-]+", "", value)\n\n\ndef existing_slug_for_title(title: str) -> str | None:\n    if not ARTICLES_JSON.exists():\n        return None\n    try:\n        data = json.loads(ARTICLES_JSON.read_text(encoding="utf-8"))\n    except Exception:\n        return None\n    target = normalized_title(title)\n    for item in data:\n        existing_title = str(item.get("title", ""))\n        slug = str(item.get("slug", ""))\n        if slug and normalized_title(existing_title) == target:\n            return slug\n    return None\n'''
          if 'def existing_slug_for_title' not in text:
              if anchor not in text:
                  raise SystemExit('stable_slug anchor not found')
              text = text.replace(anchor, addition, 1)
          old = '        slug = args.slug or stable_slug(title)\n'
          new = '        slug = args.slug or existing_slug_for_title(title) or stable_slug(title)\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('slug selection line not found')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify Laopu title resolves to existing website slug
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          import publish_wechatsync_zip as bridge
          title = '老铺黄金的10亿单店：真正的考试，不在金价上涨时'
          slug = bridge.existing_slug_for_title(title)
          if slug != 'laopu-gold-10b-store-cycle-test':
              raise SystemExit(f'unexpected slug: {slug}')
          print(f'existing article URL preserved: {slug}')
          PY

      - name: Remove workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/patch-wechatsync-slug-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reuse existing website URL when resyncing articles" || exit 0
          git push

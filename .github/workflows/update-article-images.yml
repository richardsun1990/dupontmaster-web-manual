name: Update Article Images

on:
  push:
    branches: [main]
    paths:
      - 'publishing-image-updates/**/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-article-images
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate image update manifest
        id: cfg
        shell: bash
        run: |
          cfg="$(find publishing-image-updates -mindepth 2 -maxdepth 2 -name manifest.json -print | sort | head -n 1)"
          if [[ -z "$cfg" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "config=$cfg" >> "$GITHUB_OUTPUT"
          echo "project_dir=$(dirname "$cfg")" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publishing dependencies
        if: steps.cfg.outputs.ready == 'true'
        run: pip install --disable-pip-version-check oss2 markdown pillow requests

      - name: Prepare update manifest
        if: steps.cfg.outputs.ready == 'true'
        run: python scripts/prepare_article_image_update.py '${{ steps.cfg.outputs.config }}'

      - name: Replace images and publish to OSS
        if: steps.cfg.outputs.ready == 'true'
        env:
          PUBLISH_MANIFEST: /tmp/article-image-update/manifest.json
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ vars.ALIYUN_OSS_BUCKET || secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ vars.ALIYUN_OSS_ENDPOINT || secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_PUBLIC_BASE_URL: ${{ vars.ALIYUN_OSS_PUBLIC_BASE_URL || secrets.ALIYUN_OSS_PUBLIC_BASE_URL }}
          ALIYUN_OSS_PREFIX: ${{ vars.ALIYUN_OSS_PREFIX || 'blog/admin' }}
        run: python scripts/publish_oss_article.py

      - name: Remove completed request
        if: steps.cfg.outputs.ready == 'true'
        run: rm -rf '${{ steps.cfg.outputs.project_dir }}'

      - name: Commit updated article
        if: steps.cfg.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "更新官网文章配图：$(basename '${{ steps.cfg.outputs.project_dir }}')" || exit 0
          git push

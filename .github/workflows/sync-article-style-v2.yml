name: Sync Article Style V2

on:
  push:
    branches:
      - feat/legal-blog-refresh-v1
    paths:
      - 'scripts/apply_article_skin.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/legal-blog-refresh-v1

      - name: Apply shared article skin
        run: python scripts/apply_article_skin.py

      - name: Commit migrated article pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/articles/*.html blog/article.html scripts/publish_oss_article.py
          git commit -m "style: 统一历史文章正文与发布模板" || exit 0
          git push origin HEAD:feat/legal-blog-refresh-v1

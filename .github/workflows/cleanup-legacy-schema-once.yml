name: Cleanup Legacy Article Schema Once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/cleanup_legacy_schema_once.py'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove duplicate legacy Article JSON-LD
        run: python scripts/cleanup_legacy_schema_once.py

      - name: Remove one-time migration files
        shell: bash
        run: |
          rm -f scripts/cleanup_legacy_schema_once.py
          rm -f .github/workflows/cleanup-legacy-schema-once.yml

      - name: Commit normalized article schema
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "seo: remove duplicate legacy article structured data" || exit 0
          git push

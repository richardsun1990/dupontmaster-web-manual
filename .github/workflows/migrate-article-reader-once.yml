name: Migrate article reader once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-article-reader-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migrate existing article HTML
        run: python3 scripts/migrate_article_reader_once.py
      - name: Commit migrated articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/articles
          if git diff --cached --quiet; then
            echo "No article migration needed"
            exit 0
          fi
          git commit -m "style: migrate remaining articles to unified reader"
          git push origin HEAD:main

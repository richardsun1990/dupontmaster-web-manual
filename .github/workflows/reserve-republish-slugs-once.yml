name: Reserve Republish Slugs Once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/reserve_republish_slugs_once.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/reserve_republish_slugs_once.py
      - shell: bash
        run: |
          rm -f scripts/reserve_republish_slugs_once.py
          rm -f .github/workflows/reserve-republish-slugs-once.yml
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "publishing: preserve slugs for republished articles" || exit 0
          git push

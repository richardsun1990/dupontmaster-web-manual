name: Normalize Legacy Article SEO

on:
  push:
    branches: [main]
    paths:
      - 'scripts/normalize_legacy_article_seo.py'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize legacy metadata and topic excerpts
        run: python scripts/normalize_legacy_article_seo.py

      - name: Commit normalized content
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "seo: normalize legacy article metadata and topic excerpts" || exit 0
          git push

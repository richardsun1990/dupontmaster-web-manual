name: Remove Superseded Articles Once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/remove_superseded_articles_once.py'

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove old article versions and rebuild indexes
        run: python scripts/remove_superseded_articles_once.py

      - name: Remove one-time migration files
        shell: bash
        run: |
          rm -f scripts/remove_superseded_articles_once.py
          rm -f .github/workflows/remove-old-articles-once.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content: remove superseded Tencent and Laopu articles" || exit 0
          git push

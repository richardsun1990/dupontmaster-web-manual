name: Fix Yadea Markdown Tables Once

on:
  push:
    branches: [main]
    paths:
      - 'publishing/yadea-table-fix/run.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-yadea-markdown-tables-once
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: pip install --disable-pip-version-check markdown

      - name: Convert raw HTML tables and rebuild article HTML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import re
          from pathlib import Path
          import markdown as md

          root = Path('.')
          slug = 'yadea-dealer-recovery-2025'
          md_path = root / 'content' / 'articles' / f'{slug}.md'
          html_path = root / 'blog' / 'articles' / f'{slug}.html'

          text = md_path.read_text(encoding='utf-8')
          original = text

          def clean_cell(value: str) -> str:
              value = re.sub(r'<br\s*/?>', '<br>', value, flags=re.I)
              value = re.sub(r'<[^>]+>', '', value)
              value = html.unescape(value)
              value = re.sub(r'\s+', ' ', value).strip()
              return value.replace('|', '\\|')

          def table_to_markdown(match: re.Match) -> str:
              table_html = match.group(0)
              rows = re.findall(r'<tr[^>]*>(.*?)</tr>', table_html, flags=re.I | re.S)
              parsed = []
              for row in rows:
                  cells = re.findall(r'<t[hd][^>]*>(.*?)</t[hd]>', row, flags=re.I | re.S)
                  if cells:
                      parsed.append([clean_cell(cell) for cell in cells])
              if len(parsed) < 2:
                  raise RuntimeError('无法解析HTML表格')
              width = max(len(row) for row in parsed)
              parsed = [row + [''] * (width - len(row)) for row in parsed]
              out = [
                  '| ' + ' | '.join(parsed[0]) + ' |',
                  '|' + '|'.join(['---'] * width) + '|',
              ]
              out.extend('| ' + ' | '.join(row) + ' |' for row in parsed[1:])
              return '\n'.join(out)

          pattern = re.compile(
              r'<div[^>]*overflow-x\s*:\s*auto[^>]*>\s*<table[\s\S]*?</table>\s*</div>',
              flags=re.I,
          )
          text, count = pattern.subn(table_to_markdown, text)
          if count < 1:
              raise RuntimeError('没有找到待转换的HTML表格')
          if '<table' in text or 'overflow-x:auto' in text:
              raise RuntimeError('文章仍残留原始HTML表格')
          if text == original:
              raise RuntimeError('文章内容没有发生变化')
          md_path.write_text(text, encoding='utf-8')

          # 重新生成静态文章正文，保留现有页面模板、SEO、来源与CTA。
          parts = text.split('\n---\n', 1)
          if len(parts) != 2:
              raise RuntimeError('文章frontmatter结构异常')
          body = parts[1].lstrip()
          body_for_html = re.sub(r'^# .+\n+', '', body, count=1)
          rendered = md.markdown(body_for_html, extensions=['extra', 'sane_lists'])

          page = html_path.read_text(encoding='utf-8')
          page, replaced = re.subn(
              r'(<div class="content">\s*)[\s\S]*?(\s*<div class="source-box">)',
              lambda m: m.group(1) + rendered + m.group(2),
              page,
              count=1,
          )
          if replaced != 1:
              raise RuntimeError('无法定位静态HTML正文区域')
          if '&lt;div style=&quot;overflow-x:auto' in page:
              raise RuntimeError('静态HTML仍包含转义后的表格源码')
          if '<table>' not in page:
              raise RuntimeError('静态HTML没有生成表格')
          html_path.write_text(page, encoding='utf-8')

          print(f'converted_tables={count}')
          print(f'markdown={md_path}')
          print(f'html={html_path}')
          PY

      - name: Verify fixed article
        shell: bash
        run: |
          set -euo pipefail
          md='content/articles/yadea-dealer-recovery-2025.md'
          html='blog/articles/yadea-dealer-recovery-2025.html'
          grep -q '| 维度 | 雅迪 | 爱玛 | 九号 |' "$md"
          grep -q '| 年份 | 销售净利率 | 总资产周转率 | 权益乘数 | 平均ROE |' "$md"
          grep -q '<div class="dm-table-wrap"><table>' "$html" || grep -q '<table>' "$html"
          ! grep -q '<div style="overflow-x:auto' "$md"
          ! grep -q '&lt;div style=&quot;overflow-x:auto' "$html"
          ! grep -q '<table style=' "$md"

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf publishing/yadea-table-fix
          rm -f .github/workflows/fix-yadea-tables-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '修复雅迪文章移动端表格渲染'
          git push

name: Publish Tencent Article Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-tencent-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Tencent static article
        run: python scripts/publish_article.py content/articles/tencent-ai-capital-allocation-2026.md

      - name: Restore catalog description and href
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          slug = 'tencent-ai-capital-allocation-2026'
          description = '腾讯2026年Q2资本开支升至528亿元，上半年已超过2025全年。真正需要判断的不是AI是否重要，而是AI投入能否战胜回购、分红和外部投资的机会成本，创造更高的长期资本回报。'
          path = Path('blog/articles.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          for item in data:
              if item.get('slug') == slug:
                  item['description'] = description
                  item['href'] = f'/blog/articles/{slug}.html'
                  break
          else:
              raise SystemExit('Tencent article missing from articles.json')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('publishing-result.json').write_text(json.dumps({'slug': slug}, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Refresh topic pages, homepage and sitemap
        run: python scripts/postprocess_published_article.py

      - name: Verify article and topic membership
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          slug = 'tencent-ai-capital-allocation-2026'
          html = Path(f'blog/articles/{slug}.html')
          if not html.exists():
              raise SystemExit('Tencent static HTML missing')
          text = html.read_text(encoding='utf-8')
          required = ['528亿之后，马化腾迎来腾讯最大的一次资本配置考试', 'AI不是增长引擎，而是行业税', '数据来源与口径']
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Article verification failed: {missing}')

          topics = json.loads(Path('blog/topics.json').read_text(encoding='utf-8'))
          capital = next(item for item in topics if item.get('id') == 'capital-allocation')
          if slug not in capital.get('slugs', []):
              raise SystemExit('Tencent article was not added to capital-allocation topic')
          print('Tencent article verification passed')
          PY

      - name: Remove one-time files
        shell: bash
        run: |
          rm -f publishing-result.json
          rm -f .github/workflows/publish-tencent-once.yml

      - name: Commit published website article
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "发布官网文章：腾讯AI资本配置" || exit 0
          git push

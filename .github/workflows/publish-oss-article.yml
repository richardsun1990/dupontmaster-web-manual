name: Publish OSS Article

on:
  push:
    branches: [main]
    paths:
      - 'publishing/**/asset_urls.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-oss-article
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble pending article manifests
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for metadata_path in sorted(Path('publishing').glob('*/metadata.json')):
              project_dir = metadata_path.parent
              parts = sorted(project_dir.glob('article-part-*.md'))
              if not parts:
                  continue
              manifest = json.loads(metadata_path.read_text(encoding='utf-8'))
              manifest['markdown'] = ''.join(p.read_text(encoding='utf-8') for p in parts).strip()
              (project_dir / 'manifest.json').write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
          PY

      - name: Locate pending article package
        id: pending
        shell: bash
        run: |
          manifest=""
          while IFS= read -r candidate; do
            project_dir="$(dirname "$candidate")"
            if [[ -f "$project_dir/asset_urls.json" ]]; then
              manifest="$candidate"
              break
            fi
          done < <(find publishing -mindepth 2 -maxdepth 2 -name manifest.json -print | sort)

          if [[ -n "$manifest" ]]; then
            project_dir="$(dirname "$manifest")"
            slug="$(jq -r '.slug // "article"' "$manifest")"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
            echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
            echo "slug=$slug" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No pending article package."
          fi

      - name: Set up Python
        if: steps.pending.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publishing dependencies
        if: steps.pending.outputs.ready == 'true'
        run: pip install --disable-pip-version-check oss2 markdown pillow requests

      - name: Prepare temporary image server
        if: steps.pending.outputs.ready == 'true'
        shell: bash
        run: |
          project_dir='${{ steps.pending.outputs.project_dir }}'
          mkdir -p "$project_dir/assets"
          unzip -o "$project_dir/assets.zip" -d "$project_dir/assets"
          python -m http.server 8765 --bind 127.0.0.1 --directory "$project_dir/assets" >/tmp/article-assets-http.log 2>&1 &
          echo $! > /tmp/article-assets-http.pid
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8765/cover.webp >/dev/null

      - name: Merge temporary image URLs
        if: steps.pending.outputs.ready == 'true'
        shell: bash
        run: |
          manifest='${{ steps.pending.outputs.manifest }}'
          project_dir='${{ steps.pending.outputs.project_dir }}'
          jq --slurpfile urls "$project_dir/asset_urls.json" '. + {asset_urls: $urls[0]}' "$manifest" > "$project_dir/manifest.tmp"
          mv "$project_dir/manifest.tmp" "$manifest"

      - name: Publish article and upload images to OSS
        if: steps.pending.outputs.ready == 'true'
        env:
          PUBLISH_MANIFEST: ${{ steps.pending.outputs.manifest }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ vars.ALIYUN_OSS_BUCKET || secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ vars.ALIYUN_OSS_ENDPOINT || secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_PUBLIC_BASE_URL: ${{ vars.ALIYUN_OSS_PUBLIC_BASE_URL || secrets.ALIYUN_OSS_PUBLIC_BASE_URL }}
          ALIYUN_OSS_PREFIX: ${{ vars.ALIYUN_OSS_PREFIX || 'blog/admin' }}
        run: python scripts/publish_oss_article.py

      - name: Commit published article
        if: steps.pending.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "发布官网文章：${{ steps.pending.outputs.slug }}" || exit 0
          git push

name: Migrate Existing Content SEO

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate_existing_content_seo.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Markdown renderer
        run: pip install --disable-pip-version-check markdown

      - name: Run migration
        run: python scripts/migrate_existing_content_seo.py

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "seo: integrate existing research into topic system" || exit 0
          git push

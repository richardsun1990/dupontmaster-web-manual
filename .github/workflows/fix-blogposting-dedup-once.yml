name: Fix BlogPosting Dedup Once

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_blogposting_dedup_once.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_blogposting_dedup_once.py
      - shell: bash
        run: |
          rm -f scripts/fix_blogposting_dedup_once.py
          rm -f .github/workflows/fix-blogposting-dedup-once.yml
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "seo: dedupe BlogPosting structured data" || exit 0
          git push

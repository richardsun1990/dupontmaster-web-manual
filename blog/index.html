        .article-grid {

        .article-card {

            text-decoration: none;
            color: inherit;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: var(--card-shadow);
        }
        
        .article-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.12);
        }

            font-weight: 600;
            margin-bottom: 12px;

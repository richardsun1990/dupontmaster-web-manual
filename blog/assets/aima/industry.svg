<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><style>.bg{fill:#f7f9fc}.card{fill:#fff;stroke:#e4e8f0;stroke-width:2}.title{font:700 54px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#111827}.sub{font:500 25px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#64748b}.h2{font:700 32px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#111827}.label{font:600 22px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.small{font:500 18px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#64748b}.num{font:700 48px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#4338ca}.red{fill:#dc2626}.green{fill:#059669}.blue{fill:#2563eb}.purple{fill:#6d28d9}.orange{fill:#ea580c}.footer{font:600 17px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#64748b;letter-spacing:1px}</style><rect width="1600" height="900" class="bg"/><text x="85" y="105" class="title">3.8亿辆之后，电动车进入存量竞争时代</text><text x="88" y="150" class="sub">行业增长从“新增用户”转向“更新需求、产品升级与份额集中”</text><rect x="85" y="210" width="480" height="520" rx="28" class="card"/><text x="135" y="310" class="num" style="font-size:110px">3.8亿辆</text><text x="140" y="365" class="h2">社会保有量</text><text x="140" y="415" class="sub">约每4个人拥有1辆</text><line x1="140" y1="470" x2="510" y2="470" stroke="#e2e8f0" stroke-width="2"/><text x="140" y="525" class="label">行业性质改变</text><text x="140" y="575" class="small">过去：渗透率提升</text><text x="140" y="620" class="small">现在：自然更新 + 政策换购</text><text x="140" y="665" class="small">未来：份额集中 + ASP升级</text><rect x="620" y="210" width="895" height="520" rx="28" class="card"/><text x="675" y="270" class="h2">需求结构变化</text><g transform="translate(690 340)"><rect x="0" y="0" width="220" height="120" rx="20" fill="#eef2ff"/><text x="110" y="48" text-anchor="middle" class="label">新增购买</text><text x="110" y="88" text-anchor="middle" class="small">高速渗透期</text><text x="260" y="70" class="h2">→</text><rect x="340" y="0" width="220" height="120" rx="20" fill="#ecfdf5"/><text x="450" y="48" text-anchor="middle" class="label">存量更新</text><text x="450" y="88" text-anchor="middle" class="small">自然淘汰</text><text x="600" y="70" class="h2">+</text><rect x="680" y="0" width="160" height="120" rx="20" fill="#fff7ed"/><text x="760" y="48" text-anchor="middle" class="label">升级</text><text x="760" y="88" text-anchor="middle" class="small">ASP提升</text></g><g transform="translate(690 525)"><rect width="790" height="130" rx="22" fill="#fff1f2"/><text x="35" y="48" class="h2 red">关键变化</text><text x="35" y="92" class="label">新增产能不再天然对应新增需求，必须靠抢份额或创造新品类消化。</text></g><line x1="85" y1="800" x2="1515" y2="800" stroke="#cbd5e1" stroke-width="2"/><text x="90" y="842" class="footer">DUPONTMASTER.COM · 数据来源：工信部、行业公开资料</text></svg>
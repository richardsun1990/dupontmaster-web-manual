<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小红书图片生成器 - DuPont Master</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #ff6b6b, #ffa502);
            border-radius: 2px;
        }
        
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #34495e;
            margin-bottom: 8px;
        }
        
        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #ecf0f1;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        
        textarea:focus {
            outline: none;
            border-color: #3498db;
        }
        
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        
        .option-group {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }
        
        .style-options, .layout-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        
        .style-btn, .layout-btn {
            padding: 8px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            background: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .style-btn:hover, .layout-btn:hover {
            border-color: #3498db;
            transform: translateY(-1px);
        }
        
        .style-btn.active, .layout-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }
        
        .preset-btn {
            padding: 10px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            background: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .preset-btn:hover {
            border-color: #3498db;
            transform: translateY(-1px);
        }
        
        .preset-btn.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-color: transparent;
        }
        
        .btn-generate {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-generate:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .progress-text {
            color: #7f8c8d;
            font-size: 14px;
        }
        
        .preview-section {
            display: none;
        }
        
        .preview-section.active {
            display: block;
        }
        
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .preview-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            background: #f0f0f0;
        }
        
        .preview-item img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .preview-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
        }
        
        .merged-preview {
            margin: 20px 0;
            text-align: center;
        }
        
        .merged-preview img {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
        
        .btn-download {
            padding: 12px 24px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 5px;
            transition: all 0.3s;
        }
        
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
        }
        
        .error-msg {
            background: #ffeaa7;
            padding: 15px;
            border-radius: 10px;
            color: #d63031;
            margin-top: 15px;
            font-size: 14px;
        }
        
        .success-msg {
            background: #d4edda;
            padding: 15px;
            border-radius: 10px;
            color: #155724;
            margin-top: 15px;
            font-size: 14px;
        }
        
        .tips {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 10px;
            font-size: 13px;
            color: #2c3e50;
            line-height: 1.6;
        }
        
        .tips strong {
            color: #3498db;
        }
        
        .image-count-slider {
            width: 100%;
            margin-top: 10px;
        }
        
        .count-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 5px;
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e0e0e0;
            -webkit-appearance: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
        }
        
        .api-config {
            background: #fff3cd;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .api-config input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-top: 8px;
        }
        
        .api-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 10px;
        }
        
        .api-status.connected {
            background: #d4edda;
            color: #155724;
        }
        
        .api-status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }
        
        .merge-progress {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }
        
        .merge-progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        
        .merge-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 小红书图片生成器</h1>
        <p class="subtitle">DuPont Master 财务分析内容创作工具（独立版）</p>
        
        <!-- API配置 -->
        <div class="api-config">
            <label style="display: flex; align-items: center;">
                🔑 DashScope API密钥
                <span class="api-status disconnected" id="apiStatus">未配置</span>
            </label>
            <input type="password" id="apiKey" placeholder="输入您的阿里云 DashScope API密钥" />
            <p style="font-size: 12px; color: #7f8c8d; margin-top: 8px;">
                用于生成AI图片，需要阿里云通义万相API密钥。
                <a href="https://dashscope.console.aliyun.com/apiKey" target="_blank" style="color: #3498db;">获取密钥 →</a>
            </p>
        </div>
        
        <!-- 输入区域 -->
        <div class="card">
            <div class="card-title">📝 输入内容</div>
            <textarea id="contentInput" placeholder="请输入想要生成小红书图片的内容...

例如：
• 泸州老窖2024年财务分析：营收增长15%，净利润创新高，ROE达28%
• 贵州茅台 vs 五粮液：核心财务指标对比，营收、净利润、毛利率全面解析
• 投资工具推荐：如何使用DuPont Master分析净资产收益率，提升投资决策质量"></textarea>
            
            <div class="tips">
                <strong>💡 提示：</strong>内容越清晰、要点越明确，生成的图片效果越好。建议包含具体数据、对比信息或明确的结论。
            </div>
        </div>
        
        <!-- 样式选择 -->
        <div class="card">
            <div class="card-title">🎨 选择风格</div>
            
            <div class="options-grid">
                <div class="option-group">
                    <label>快速预设</label>
                    <div class="style-options">
                        <button class="preset-btn" data-preset="knowledge-card">📚 知识卡片</button>
                        <button class="preset-btn" data-preset="tutorial">📖 教程步骤</button>
                        <button class="preset-btn" data-preset="checklist">✅ 清单列表</button>
                        <button class="preset-btn" data-preset="product-review">🔍 产品对比</button>
                    </div>
                </div>
                
                <div class="option-group">
                    <label>视觉风格</label>
                    <div class="style-options">
                        <button class="style-btn active" data-style="notion">📓 知识风</button>
                        <button class="style-btn" data-style="chalkboard">📋 黑板风</button>
                        <button class="style-btn" data-style="cute">🌸 可爱风</button>
                        <button class="style-btn" data-style="bold">💥 强烈风</button>
                        <button class="style-btn" data-style="minimal">✨ 简约风</button>
                    </div>
                </div>
            </div>
            
            <div class="option-group" style="margin-top: 15px;">
                <label>布局方式</label>
                <div class="layout-options">
                    <button class="layout-btn active" data-layout="dense">📊 密集型</button>
                    <button class="layout-btn" data-layout="balanced">⚖️ 平衡型</button>
                    <button class="layout-btn" data-layout="sparse">🎯 稀疏型</button>
                    <button class="layout-btn" data-layout="list">📋 列表型</button>
                    <button class="layout-btn" data-layout="flow">🔄 流程型</button>
                    <button class="layout-btn" data-layout="comparison">⚔️ 对比型</button>
                </div>
            </div>
            
            <div class="option-group" style="margin-top: 15px;">
                <label>图片数量</label>
                <input type="range" class="image-count-slider" id="imageCount" min="3" max="6" value="4">
                <div class="count-display">
                    <span>3张</span>
                    <span id="countValue">4张</span>
                    <span>6张</span>
                </div>
            </div>
        </div>
        
        <!-- 生成按钮 -->
        <button class="btn-generate" id="generateBtn">
            🚀 开始生成图片
        </button>
        
        <!-- 加载状态 -->
        <div class="card loading" id="loadingCard">
            <div class="spinner"></div>
            <p class="progress-text" id="progressText">正在分析内容...</p>
            <div class="merge-progress" id="mergeProgress" style="display: none;">
                <p id="mergeStatus">准备中...</p>
                <div class="merge-progress-bar">
                    <div class="merge-progress-fill" id="mergeProgressFill" style="width: 0%"></div>
                </div>
            </div>
        </div>
        
        <!-- 错误提示 -->
        <div class="error-msg" id="errorMsg" style="display: none;"></div>
        
        <!-- 预览区域 -->
        <div class="card preview-section" id="previewSection">
            <div class="card-title">🖼️ 生成结果</div>
            
            <div class="preview-grid" id="previewGrid"></div>
            
            <div class="merged-preview" id="mergedPreview"></div>
            
            <div style="text-align: center;">
                <button class="btn-download" id="downloadMerged">📥 下载合并长图</button>
                <button class="btn-download" id="downloadAll">📦 下载所有图片</button>
            </div>
        </div>
        
        <div class="success-msg" id="successMsg" style="display: none;"></div>
    </div>
    
    <script>
        // 状态管理
        let selectedStyle = 'notion';
        let selectedLayout = 'dense';
        let selectedPreset = null;
        let imageCount = 4;
        let generatedImages = [];
        let mergedImageDataUrl = null;
        
        // 样式预设映射
        const stylePresets = {
            'knowledge-card': { style: 'notion', layout: 'dense' },
            'tutorial': { style: 'chalkboard', layout: 'flow' },
            'checklist': { style: 'notion', layout: 'list' },
            'product-review': { style: 'fresh', layout: 'comparison' }
        };
        
        // API配置检查
        const apiKeyInput = document.getElementById('apiKey');
        const apiStatus = document.getElementById('apiStatus');
        
        function checkApiKey() {
            const key = localStorage.getItem('DASHSCOPE_API_KEY') || apiKeyInput.value.trim();
            if (key && key.length > 10) {
                apiStatus.textContent = '已配置';
                apiStatus.className = 'api-status connected';
                return key;
            }
            apiStatus.textContent = '未配置';
            apiStatus.className = 'api-status disconnected';
            return null;
        }
        
        apiKeyInput.addEventListener('change', () => {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('DASHSCOPE_API_KEY', key);
            }
            checkApiKey();
        });
        
        // 初始化时检查存储的key
        const storedKey = localStorage.getItem('DASHSCOPE_API_KEY');
        if (storedKey) {
            apiKeyInput.value = storedKey;
            checkApiKey();
        }
        
        // 预设按钮点击
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedPreset = btn.dataset.preset;
                const preset = stylePresets[selectedPreset];
                selectStyle(preset.style);
                selectLayout(preset.layout);
            });
        });
        
        // 样式按钮点击
        document.querySelectorAll('.style-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                selectedPreset = null;
                selectStyle(btn.dataset.style);
            });
        });
        
        // 布局按钮点击
        document.querySelectorAll('.layout-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                selectLayout(btn.dataset.layout);
            });
        });
        
        function selectStyle(style) {
            selectedStyle = style;
            document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-style="${style}"]`).classList.add('active');
        }
        
        function selectLayout(layout) {
            selectedLayout = layout;
            document.querySelectorAll('.layout-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-layout="${layout}"]`).classList.add('active');
        }
        
        // 图片数量滑块
        document.getElementById('imageCount').addEventListener('input', (e) => {
            imageCount = parseInt(e.target.value);
            document.getElementById('countValue').textContent = `${imageCount}张`;
        });
        
        // 生成提示词
        function generatePrompts(content, style, layout, count) {
            const prompts = [];
            const sentences = content.split(/[。！？\n；,]/).filter(s => s.trim().length > 5);
            const partSize = Math.ceil(sentences.length / Math.max(count - 2, 1));
            
            const styleDescs = {
                'notion': '知识风格，手绘线条，极简主义，大量留白',
                'chalkboard': '黑板风格，粉笔质感，教育感，复古氛围',
                'cute': '可爱风格，柔和色调，少女风，温馨可爱',
                'bold': '强烈风格，高对比度，冲击力，醒目',
                'minimal': '简约风格，大量留白，高级感，优雅'
            };
            
            const layoutDescs = {
                'dense': '信息密集展示，多元素排列',
                'balanced': '平衡布局，图文并茂',
                'sparse': '稀疏留白，重点突出',
                'list': '清单列表形式，条目清晰',
                'flow': '流程图形式，步骤分明',
                'comparison': '对比展示形式，左右对照'
            };
            
            const s = styleDescs[style] || styleDescs['notion'];
            const l = layoutDescs[layout] || layoutDescs['balanced'];
            
            // 封面
            prompts.push({
                index: 1,
                type: 'cover',
                prompt: `小红书风格封面图，${s}，${l}
                
主题：${content.substring(0, 80)}
关键信息：${sentences.slice(0, 3).join('，')}

要求：
- 9:16竖版比例
- 中文文字清晰醒目
- 视觉冲击力强，适合小红书平台
- 吸引眼球的设计风格`
            });
            
            // 内容页
            for (let i = 0; i < count - 2; i++) {
                const start = i * partSize;
                const part = sentences.slice(start, Math.min(start + partSize, sentences.length)).join('。');
                
                prompts.push({
                    index: i + 2,
                    type: 'content',
                    prompt: `小红书风格内容图（第${i + 2}页），${s}，${l}
                    
要点：${part.substring(0, 200)}

要求：
- 9:16竖版比例
- 保持与封面风格一致
- 内容清晰易读
- 中文排版美观`
                });
            }
            
            // 结尾
            prompts.push({
                index: count,
                type: 'ending',
                prompt: `小红书风格结尾图，${s}
                
引导语：感谢阅读，欢迎关注收藏

要求：
- 9:16竖版比例
- 简洁有力
- 包含关注/收藏引导
- 中文文字清晰可见
- 与整体风格一致`
            });
            
            return prompts;
        }
        
        // 调用DashScope API生成图片
        async function generateImage(apiKey, prompt, index) {
            const response = await fetch('https://dashscope.aliyuncs.com/api/v1/services/aigc/text2image/image-synthesis', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: 'wanx-v1',
                    input: {
                        prompt: prompt
                    },
                    parameters: {
                        size: '1024*1792',
                        save_format: 'PNG'
                    }
                })
            });
            
            if (!response.ok) {
                const error = await response.json().catch(() => ({}));
                throw new Error(error.error?.message || `API请求失败: ${response.status}`);
            }
            
            const data = await response.json();
            
            // 获取图片URL
            if (data.output?.image_url) {
                return data.output.image_url;
            }
            
            // 轮询任务结果
            if (data.output?.task_id) {
                return await pollTaskResult(apiKey, data.output.task_id);
            }
            
            throw new Error('未找到图片生成结果');
        }
        
        // 轮询任务结果
        async function pollTaskResult(apiKey, taskId, maxAttempts = 60) {
            for (let i = 0; i < maxAttempts; i++) {
                await sleep(2000);
                
                const response = await fetch(`https://dashscope.aliyuncs.com/api/v1/tasks/${taskId}`, {
                    headers: {
                        'Authorization': `Bearer ${apiKey}`
                    }
                });
                
                const data = await response.json();
                
                if (data.output?.task_status === 'SUCCEEDED') {
                    return data.output.images?.[0]?.url;
                }
                
                if (data.output?.task_status === 'FAILED') {
                    throw new Error('图片生成失败');
                }
            }
            
            throw new Error('图片生成超时');
        }
        
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        // 下载图片为blob
        async function downloadImageAsBlob(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error('下载图片失败');
            return await response.blob();
        }
        
        // blob转dataURL
        function blobToDataURL(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }
        
        // 合并图片
        async function mergeImages(imageDataUrls) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // 加载所有图片获取尺寸
            const images = [];
            for (const url of imageDataUrls) {
                const img = await loadImage(url);
                images.push(img);
            }
            
            // 计算总尺寸
            const width = 1080;
            const height = images[0].height;
            const totalHeight = height * images.length;
            
            canvas.width = width;
            canvas.height = totalHeight;
            
            // 绘制
            let y = 0;
            for (const img of images) {
                ctx.drawImage(img, 0, y, width, height);
                y += height;
            }
            
            return canvas.toDataURL('image/png');
        }
        
        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('加载图片失败'));
                img.src = src;
            });
        }
        
        // 生成按钮
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const apiKey = checkApiKey();
            if (!apiKey) {
                showError('请先配置 DashScope API密钥');
                return;
            }
            
            const content = document.getElementById('contentInput').value.trim();
            if (!content || content.length < 10) {
                showError('请输入要生成的内容（至少10个字符）');
                return;
            }
            
            // 隐藏之前的结果
            document.getElementById('previewSection').classList.remove('active');
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';
            
            // 显示加载状态
            const loadingCard = document.getElementById('loadingCard');
            const generateBtn = document.getElementById('generateBtn');
            const progressText = document.getElementById('progressText');
            const mergeProgress = document.getElementById('mergeProgress');
            
            loadingCard.classList.add('active');
            generateBtn.disabled = true;
            
            try {
                generatedImages = [];
                const prompts = generatePrompts(content, selectedStyle, selectedLayout, imageCount);
                
                // 生成每张图片
                for (let i = 0; i < prompts.length; i++) {
                    progressText.textContent = `正在生成第 ${i + 1}/${prompts.length} 张图片...`;
                    
                    const imageUrl = await generateImage(apiKey, prompts[i].prompt, i + 1);
                    const blob = await downloadImageAsBlob(imageUrl);
                    const dataUrl = await blobToDataURL(blob);
                    
                    generatedImages.push(dataUrl);
                }
                
                // 合并图片
                progressText.textContent = '正在合并图片...';
                mergeProgress.style.display = 'block';
                
                const mergeStatus = document.getElementById('mergeStatus');
                const mergeFill = document.getElementById('mergeProgressFill');
                
                mergeStatus.textContent = '下载图片中...';
                mergeFill.style.width = '30%';
                
                const mergedDataUrl = await mergeImages(generatedImages);
                mergedImageDataUrl = mergedDataUrl;
                
                mergeFill.style.width = '100%';
                mergeStatus.textContent = '合并完成！';
                
                // 显示预览
                displayPreview();
                showSuccess('🎉 图片生成成功！可以下载了。');
                
            } catch (error) {
                console.error('生成失败:', error);
                showError(`生成失败: ${error.message}`);
            } finally {
                loadingCard.classList.remove('active');
                mergeProgress.style.display = 'none';
                generateBtn.disabled = false;
            }
        });
        
        // 显示预览
        function displayPreview() {
            const previewSection = document.getElementById('previewSection');
            const previewGrid = document.getElementById('previewGrid');
            const mergedPreview = document.getElementById('mergedPreview');
            
            // 清除之前的预览
            previewGrid.innerHTML = '';
            mergedPreview.innerHTML = '';
            
            // 添加单张预览
            generatedImages.forEach((dataUrl, index) => {
                const item = document.createElement('div');
                item.className = 'preview-item';
                item.innerHTML = `
                    <img src="${dataUrl}" alt="图片 ${index + 1}">
                    <span class="preview-label">第${index + 1}张</span>
                `;
                previewGrid.appendChild(item);
            });
            
            // 添加合并预览
            if (mergedImageDataUrl) {
                mergedPreview.innerHTML = `
                    <p style="margin-bottom: 15px; color: #7f8c8d; font-size: 14px;">📱 合并后的长图（可直接发布小红书）</p>
                    <img src="${mergedImageDataUrl}" alt="合并长图" style="max-height: 400px; border-radius: 12px;">
                `;
            }
            
            previewSection.classList.add('active');
            
            // 滚动到预览区域
            previewSection.scrollIntoView({ behavior: 'smooth' });
        }
        
        // 显示错误
        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
        }
        
        // 显示成功
        function showSuccess(message) {
            const successMsg = document.getElementById('successMsg');
            successMsg.textContent = message;
            successMsg.style.display = 'block';
        }
        
        // 下载合并长图
        document.getElementById('downloadMerged').addEventListener('click', () => {
            if (mergedImageDataUrl) {
                downloadDataUrl(mergedImageDataUrl, 'xhs-merged.png');
            }
        });
        
        // 下载所有图片
        document.getElementById('downloadAll').addEventListener('click', () => {
            generatedImages.forEach((dataUrl, index) => {
                setTimeout(() => {
                    downloadDataUrl(dataUrl, `xhs-image-${index + 1}.png`);
                }, index * 300);
            });
        });
        
        // 下载数据URL
        function downloadDataUrl(dataUrl, filename) {
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
